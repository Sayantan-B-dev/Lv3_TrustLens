[project]
name = "trustlens-backend"
version = "1.0.0"
description = "TrustLens API, intelligence pipeline and embedded worker"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "cryptography>=44",
  "httpx>=0.28",
  "certifi>=2025.1",
  "dnspython>=2.7",
  "pycryptodome>=3.21",
  "eth-account>=0.13",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
